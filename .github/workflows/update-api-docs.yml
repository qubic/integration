name: Update API Docs

on:
  workflow_dispatch: # Manual trigger
  repository_dispatch: # Trigger from other repos
    types: [live-api-update, query-api-update]

jobs:
  live-api-update:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'live-api-update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Decode Live API OpenAPI spec from payload
        run: |
          echo "${{ github.event.client_payload.openapi_spec_base64 }}" | base64 -d > Partners/swagger/qubic-http.openapi.yaml

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add Partners/swagger/qubic-http.openapi.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Live API Docs" && git push)

  query-api-update:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'query-api-update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Checkout archive-query-service
        uses: actions/checkout@v6
        with:
          repository: qubic/archive-query-service
          ref: ${{ github.event.client_payload.ref || 'main' }}
          path: archive-query-service

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26.x

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install protoc-gen-openapi
        run: go install github.com/google/gnostic/cmd/protoc-gen-openapi@latest

      - name: Generate OpenAPI spec
        working-directory: archive-query-service/v2
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make openapi-v3-gen

      - name: Apply OpenAPI adjustments
        run: |
          cd archive-query-service/v2/api/archive-query-service/v2
          yq -i --indent 4 'del(.paths."/health")' query_services.openapi.yaml
          yq -i --indent 4 '(.tags[] | select(.name == "ArchiveQueryService")).x-scalar-ignore = true' query_services.openapi.yaml
          yq -i --indent 4 '(.paths[][].tags) -= ["ArchiveQueryService"]' query_services.openapi.yaml

      - name: Copy spec into place
        run: cp archive-query-service/v2/api/archive-query-service/v2/query_services.openapi.yaml Partners/swagger/query_services.openapi.yaml

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add Partners/swagger/query_services.openapi.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Query API Docs" && git push)
